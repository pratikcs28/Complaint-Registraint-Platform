<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Complaint | ResolveIt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            ResolveIt
        </a>
        <div class="navbar-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="add-complaint.html" class="btn-primary">+ New Complaint</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="page-header">
            <h1 class="page-title">Register an Issue</h1>
            <p class="page-subtitle">Fill out the form below to submit your complaint</p>
        </div>

        <div class="form-card">
            <form id="complaintForm">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" name="city" class="form-control" required placeholder="New York">
                </div>

                <div class="form-group">
                    <label for="mobile" class="form-label">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" class="form-control" required placeholder="+1 234 567 8900" pattern="[\+]?[0-9\s\-\(\)]+">
                </div>

                <div class="form-group">
                    <label for="complaintText" class="form-label">Complaint Details</label>
                    <textarea id="complaintText" name="complaintText" class="form-control" required placeholder="Please describe your issue in detail..."></textarea>
                </div>

                <div id="aiSection" style="display: none; margin-top: 1rem; padding: 1rem; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius);">
                    <label class="form-label" style="color: var(--primary-color);">AI Follow-up Question</label>
                    <p id="aiQuestionText" style="margin-bottom: 0.75rem; font-weight: 500; line-height: 1.4;"></p>
                    <textarea id="aiAnswer" name="aiAnswer" class="form-control" placeholder="Your answer..."></textarea>
                </div>

                <button type="button" id="btnGenerateQuestion" class="btn-primary" style="width: 100%; padding: 0.875rem; font-size: 1.1rem; margin-top: 1rem;">
                    Generate Follow-up Question
                </button>

                <button type="submit" id="btnSubmitComplaint" class="btn-primary" style="width: 100%; padding: 0.875rem; font-size: 1.1rem; margin-top: 1rem; display: none;">
                    Submit Complaint
                </button>
            </form>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span id="toastMsg">Complaint registered successfully!</span>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 ResolveIt Platform. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
